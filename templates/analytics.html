<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аналитика блюд</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">

    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mb-3">⬅ Назад</a>

    <h2 class="mb-4">📊 Аналитика продаж</h2>

    <!-- Фильтр по датам -->
    <form method="get" class="row g-3 mb-4">
        <div class="col-md-4">
            <input type="date" name="date_from" class="form-control" value="{{ date_from }}">
        </div>
        <div class="col-md-4">
            <input type="date" name="date_to" class="form-control" value="{{ date_to }}">
        </div>
        <div class="col-md-4">
            <button class="btn btn-primary w-100">Фильтровать</button>
        </div>
    </form>

    <!-- Карточки -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card text-center p-3">
                <h4>💰 Общая выручка</h4>
                <h2>{{ total_income }} сом</h2>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card text-center p-3">
                <h4>🍽 Продано блюд</h4>
                <h2>{{ total_qty }}</h2>
            </div>
        </div>
    </div>

    <!-- ТОП 5 -->
    <h4>🏆 ТОП-5 блюд</h4>
    <ul class="list-group mb-4">
        {% for name, qty in top_dishes %}
        <li class="list-group-item d-flex justify-content-between">
            {{ name }}
            <span class="badge bg-primary">{{ qty }}</span>
        </li>
        {% endfor %}
    </ul>

    <!-- Графики -->
    <div class="row">
        <div class="col-md-6">
            <canvas id="salesChart"></canvas>
        </div>
        <div class="col-md-6">
            <canvas id="topChart"></canvas>
        </div>
    </div>

</div>

<script>
const salesData = {
    labels: {{ sales_by_day | map(attribute=0) | list | safe }},
    datasets: [{
        label: 'Выручка по дням',
        data: {{ sales_by_day | map(attribute=1) | list | safe }},
    }]
};

new Chart(document.getElementById('salesChart'), {
    type: 'line',
    data: salesData
});

const topData = {
    labels: {{ top_dishes | map(attribute=0) | list | safe }},
    datasets: [{
        label: 'ТОП блюда',
        data: {{ top_dishes | map(attribute=1) | list | safe }},
    }]
};

new Chart(document.getElementById('topChart'), {
    type: 'bar',
    data: topData
});
</script>

</body>
</html>
